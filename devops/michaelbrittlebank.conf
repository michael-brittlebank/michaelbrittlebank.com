# Apex redirect (michaelbrittlebank.com -> https://www)
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name michaelbrittlebank.com;

    ssl_certificate /etc/letsencrypt/live/michaelbrittlebank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelbrittlebank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.michaelbrittlebank.com$request_uri;
}

# HTTP -> HTTPS redirect for www and catch-all
server {
    listen 80 default_server;
    server_name _ www.michaelbrittlebank.com;
    return 301 https://www.michaelbrittlebank.com$request_uri;
}

# Main site (https://michaelbrittlebank.com)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _ www.michaelbrittlebank.com;

    ssl_certificate /etc/letsencrypt/live/michaelbrittlebank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelbrittlebank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/michaelbrittlebank.com.access.log;
    error_log  /var/log/nginx/michaelbrittlebank.com.error.log;

    root /var/www/michaelbrittlebank.com/dist;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# Reading list (WordPress)
server {
    server_name wordpress.michaelbrittlebank.com;

    root /var/www/wordpress.michaelbrittlebank.com;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wordpress.michaelbrittlebank.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wordpress.michaelbrittlebank.com/privkey.pem; # managed by Cert>
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = wordpress.michaelbrittlebank.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name wordpress.michaelbrittlebank.com;
    return 404; # managed by Certbot


}
